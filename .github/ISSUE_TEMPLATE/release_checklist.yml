name: Release checklist
description: Maintainers only — track a release from main
title: "Release vX.Y.Z"
labels: ["release"]
body:
  - type: markdown
    attributes:
      value: |
        Maintainers only. Releases are tags on `main`; see
        [docs/branching.md](https://github.com/ravibagri5/crossplane-mcp-server/blob/main/docs/branching.md#releasing).

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.5.0
    validations:
      required: true

  - type: checkboxes
    id: prepare
    attributes:
      label: Prepare
      options:
        - label: Milestone has no open blockers
        - label: CHANGELOG `Unreleased` section moved under the version heading, merged to `main`
        - label: README tool table matches the registered tools
        - label: Compatibility matrix checked against current Crossplane and Kubernetes
        - label: Registry metadata (`server.json`, `manifest.json`, smithery) updated

  - type: checkboxes
    id: candidate
    attributes:
      label: Optional release candidate
      options:
        - label: "`vX.Y.Z-rc.N` tagged on `main` and smoke-tested against Crossplane v1 and v2 control planes in at least two MCP clients"

  - type: checkboxes
    id: release
    attributes:
      label: Release
      options:
        - label: Signed `vX.Y.Z` tag pushed from `main` and the release workflow succeeded
        - label: Container image, checksums and signatures published
        - label: Milestone closed, unfinished items moved to the next milestone
        - label: Release announced in Discussions
